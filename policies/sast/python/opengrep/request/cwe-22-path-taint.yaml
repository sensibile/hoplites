rules:
  - id: hoplites.python.cwe-22.file-path-from-input.request
    languages: [python]
    severity: ERROR
    message: >-
      Request data or a helper parameter selects a file path without containment. Use
      safe_join/send_from_directory or check realpath with os.path.commonpath.
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: flask.request.$ATTR
          - pattern: flask.request.$FN(...)
    pattern-sanitizers:
      - pattern-either:
          - pattern: safe_join(...)
          - pattern: werkzeug.security.safe_join(...)
          - pattern: werkzeug.utils.secure_filename(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: open($PATH, ...)
              - pattern: flask.send_file($PATH, ...)
          - pattern-not-inside: |
              def $F(...):
                ...
                if <... os.path.commonpath(...) ...>:
                  ...
                ...
          - focus-metavariable: $PATH
    metadata:
      cwe: ["CWE-22: Improper Limitation of a Pathname to a Restricted Directory"]
      confidence: MEDIUM
      hoplites-rule-version: 1
      hoplites-origin:
        source: agent-confirmed dev cases
        hypotheses: [A-8, A-11]
        explore-prompt: hoplites-sast-agent-explore/1
        synthesis: hoplites-sast-rule-synthesis/1
        model: claude-opus-5-5
      hoplites-regression-cases: [D-22-1, D-22-4]
  - id: hoplites.python.cwe-22.tar-extract-without-filter
    languages: [python]
    severity: ERROR
    message: >-
      tarfile extraction without a filter can write outside the destination (Python < 3.14
      default). Pass filter="data" or validate each member.
    patterns:
      - pattern-either:
          - pattern: $T.extractall(...)
          - pattern: $T.extract(...)
      - pattern-not: $T.extractall(..., filter=$X, ...)
      - pattern-not: $T.extract(..., filter=$X, ...)
      - pattern-either:
          - pattern-inside: |
              with tarfile.open(...) as $T:
                ...
          - pattern-inside: |
              $T = tarfile.open(...)
              ...
    metadata:
      cwe: ["CWE-22: Improper Limitation of a Pathname to a Restricted Directory"]
      confidence: MEDIUM
      hoplites-rule-version: 1
      hoplites-origin:
        source: agent-confirmed dev cases
        hypotheses: [A-10]
        explore-prompt: hoplites-sast-agent-explore/1
        synthesis: hoplites-sast-rule-synthesis/1
        model: claude-opus-5-5
      hoplites-regression-cases: [D-22-3]
