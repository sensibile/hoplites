name: Codex review gate tests
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  codex-review-gate-tests:
    name: codex-review-gate-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test the gate script on the PR head
        run: python3 -B -m unittest tests.test_codex_review_gate -v
