name: hoplites-dtrack
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: dtrack
      POSTGRES_USER: dtrack
      POSTGRES_PASSWORD: ${DTRACK_DB_PASSWORD:?Set DTRACK_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  apiserver:
    image: ghcr.io/dependencytrack/apiserver:5.1.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DT_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dtrack
      DT_DATASOURCE_USERNAME: dtrack
      DT_DATASOURCE_PASSWORD: ${DTRACK_DB_PASSWORD:?Set DTRACK_DB_PASSWORD in .env}
    ports:
      - '127.0.0.1:18080:8080'
    volumes:
      - apiserver-data:/data
    deploy:
      resources:
        limits:
          memory: 2g
    restart: unless-stopped
  frontend:
    image: ghcr.io/dependencytrack/frontend:5.1.1
    environment:
      API_BASE_URL: http://localhost:18080
    ports:
      - '127.0.0.1:18081:8080'
    restart: unless-stopped
volumes:
  postgres-data:
  apiserver-data:
