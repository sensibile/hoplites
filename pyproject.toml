[tool.ruff]
target-version = "py310"
line-length = 100
# Taeguk installer manages these copies; local edits would fail its --check.
extend-exclude = [".agents", ".claude", ".codex", ".taeguk"]
force-exclude = true

[tool.ruff.lint]
# Existing scripts retain their layout; catch syntax/name/control-flow errors.
select = ["E9", "F63", "F7", "F82"]
